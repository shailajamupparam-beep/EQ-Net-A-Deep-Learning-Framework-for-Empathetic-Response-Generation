<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EQNet+ Interface</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white w-full max-w-3xl rounded-2xl shadow-xl p-8">

<h1 class="text-3xl font-bold text-center text-indigo-600">
EQNet+
</h1>

<p class="text-center text-gray-500 mt-2">
Emotion Detection & Empathetic Response Generation
</p>

<form id="analyticsForm" class="mt-8">

<label class="font-semibold mb-2 block">
Enter Text
</label>

<textarea
id="textInput"
rows="5"
class="w-full border rounded-lg p-3 focus:ring-2 focus:ring-indigo-500"
placeholder="Enter your sentence..."
required></textarea>

<button
id="submitBtn"
type="submit"
class="mt-5 w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg py-3">
Analyze
</button>

</form>

<div id="loading" class="hidden text-center mt-6">

<div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mx-auto"></div>

<p class="mt-2 text-gray-500">
Processing...
</p>

</div>

<div id="resultPanel" class="hidden mt-8">

<h2 class="font-bold mb-2">
Result
</h2>

<pre id="jsonOutput"
class="bg-black text-green-400 p-4 rounded-lg overflow-auto text-sm"></pre>

</div>

</div>

<script>

//===================================================
// CHANGE THIS TO YOUR ACTUAL RENDER URL
//===================================================

const API_URL = "https://YOUR-APP-NAME.onrender.com/predict";

//===================================================

const form = document.getElementById("analyticsForm");
const input = document.getElementById("textInput");
const loading = document.getElementById("loading");
const resultPanel = document.getElementById("resultPanel");
const output = document.getElementById("jsonOutput");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async function(e){

e.preventDefault();

const text=input.value.trim();

if(text===""){
alert("Please enter some text.");
return;
}

loading.classList.remove("hidden");
resultPanel.classList.add("hidden");

button.disabled=true;

try{

const response=await fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},

body:JSON.stringify({
text:text
})

});

if(!response.ok){

throw new Error(
`HTTP ${response.status} : ${response.statusText}`
);

}

const data=await response.json();

output.textContent=JSON.stringify(data,null,4);

resultPanel.classList.remove("hidden");

}
catch(error){

output.textContent=JSON.stringify({

success:false,

error:error.message

},null,4);

resultPanel.classList.remove("hidden");

}
finally{

loading.classList.add("hidden");

button.disabled=false;

}

});

</script>

</body>
</html>
